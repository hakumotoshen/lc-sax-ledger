<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a5a">
<link rel="manifest" href="manifest.json">
<title>LC 薩克斯風帳本</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#1c2a26;--mute:#76857f;--line:#e3e9e6;--main:#0b7a5a;--main2:#16a37a;--red:#d6453d;--nav:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18231f;--ink:#e8f1ed;--mute:#8da39a;--line:#26352f;--main:#2bbf94;--main2:#58d6b0;--red:#ff7b6b;--nav:#18231f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Noto Sans TC",sans-serif;max-width:560px;margin-inline:auto;padding-bottom:84px}
header{background:linear-gradient(135deg,#0b7a5a,#16a37a);color:#fff;padding:18px 16px 70px;border-radius:0 0 24px 24px}
header h1{font-size:17px;margin:0;font-weight:600}
header small{opacity:.8}
main{padding:0 16px;margin-top:-52px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--mute);font-weight:500}
.big{font-size:32px;font-weight:700;color:var(--main);line-height:1.2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.grid small{display:block;color:var(--mute);font-size:13px}
.grid b{font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--main);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:400;padding:7px 12px;font-size:14px}
button.ghost.on{background:var(--main);color:#fff;border-color:var(--main)}
.full{width:100%;margin-top:14px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mute)}
.item .p{font-weight:700}
.item .x{background:none;color:var(--red);padding:4px 8px;font-size:18px}
.empty{color:var(--mute);text-align:center;padding:16px 0}
svg text{fill:var(--mute);font-size:10px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--mute);font-size:13px;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin-inline:auto;background:var(--nav);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:10px 0 8px;font-size:12px;font-weight:500}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--main)}
.page{display:none}.page.on{display:block}
</style>
</head>
<body>
<header><small>LC Saxophone</small><h1>薩克斯風銷售帳本</h1></header>
<main>

<!-- 總覽 -->
<section class="page on" id="p-home">
  <div class="card" id="banner" hidden style="border-left:4px solid var(--main)">
    <div id="bannerMsg"></div>
    <div class="row" style="margin-top:10px"><button id="bk2">📧 寄備份到信箱</button><button class="ghost" id="snooze">稍後</button></div>
  </div>
  <div class="card">
    <h2>累計售出總額</h2>
    <div class="big" id="tSum">NT$ 0</div>
    <div class="grid">
      <div><small>已售出</small><b id="tCount">0 件</b></div>
      <div><small>抽成累計（含複利）</small><b id="tComm" style="color:var(--main)">NT$ 0</b></div>
    </div>
  </div>
  <div class="card"><h2>銷售紀錄</h2><div id="list"></div></div>
  <div class="card">
    <h2>備份與還原</h2>
    <label>備份信箱</label><input id="mail" type="email" placeholder="your@gmail.com">
    <button class="full" id="bk">📧 寄備份到信箱</button>
    <label>還原：貼上最近一封備份信的內文</label>
    <textarea id="rs" rows="4" placeholder="把信裡的內容整段複製貼上"></textarea>
    <button class="full" id="rsBtn">還原</button>
    <div class="row" style="margin-top:14px">
      <button class="ghost" id="csv">匯出 CSV 檔</button>
      <button class="ghost" id="imp">匯入 CSV 檔</button>
      <input type="file" id="file" accept=".csv" hidden>
    </div>
  </div>
</section>

<!-- 記帳 -->
<section class="page" id="p-add">
  <div class="card">
    <h2>新增一筆銷售</h2>
    <label>類型</label>
    <select id="type"><option>高音</option><option>中音</option><option>次中音</option><option>上低音</option></select>
    <div id="headWrap"><label>高音頭型</label>
    <select id="head"><option>單頭</option><option>雙頭</option></select></div>
    <label>編號</label><input id="code" placeholder="例：S704">
    <label>塗裝（自己填，填過的會記住）</label><input id="finish" list="finishes" placeholder="例：金漆">
    <datalist id="finishes"></datalist>
    <label>成交價（元）</label><input id="price" type="number" inputmode="numeric" min="0">
    <label>買家姓名</label><input id="buyer">
    <label>售出時間</label><input id="time" type="datetime-local">
    <button class="full" id="add">記一筆</button>
  </div>
</section>

<!-- 統計 -->
<section class="page" id="p-stats">
  <div class="card"><h2>售出類型比例（件數）</h2><div id="pie"></div><div class="legend" id="legend"></div></div>
  <div class="card"><h2>各類型賣出支數</h2><div id="typeBars"></div></div>
  <div class="card"><h2>賣出累積金額</h2><div id="lineSales"></div></div>
  <div class="card">
    <h2>銷售長條圖</h2>
    <div class="tabs">
      <button class="ghost on" data-m="day">按日</button>
      <button class="ghost" data-m="month">按月</button>
      <button class="ghost" id="kind">看金額</button>
    </div>
    <div id="chart"></div>
  </div>
</section>

<!-- 抽成 -->
<section class="page" id="p-comm">
  <div class="card">
    <h2>抽成累計（含複利）</h2>
    <div class="big" id="cTotal">NT$ 0</div>
    <div class="grid">
      <div><small>抽成本金（售價 10%）</small><b id="cBase">NT$ 0</b></div>
      <div><small>複利增加</small><b id="cGain" style="color:var(--main)">NT$ 0</b></div>
    </div>
  </div>
  <div class="card"><h2>抽成累計金額走勢</h2><div id="lineComm"></div>
    <div class="note">實線：含複利金額　虛線：只算本金</div></div>
  <div class="card"><div class="note" style="margin:0">規則：每筆售出抽 10%；年利率 2% 平均成每月 2%÷12，從售出日起每滿 1 個月累計一次複利。</div></div>
</section>

</main>

<nav>
  <button class="on" data-p="home"><span>🏠</span>總覽</button>
  <button data-p="add"><span>✏️</span>記帳</button>
  <button data-p="stats"><span>📊</span>統計</button>
  <button data-p="comm"><span>💰</span>抽成</button>
</nav>

<script>
const KEY='saxSales',RATE=0.10,MR=0.02/12;
let sales=[],mode='day',kind='sum';
try{sales=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(sales))}catch(e){}};
const fmt=n=>'NT$ '+Math.round(n).toLocaleString();
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowLocal=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const label=x=>x.type?[x.type+(x.head?`(${x.head})`:''),x.code||x.note,x.finish].filter(Boolean).join('・'):(x.name||'');
const catOf=x=>x.type?(x.type==='高音'?'高音'+(x.head||''):x.type):'其他';
const CATS=['高音單頭','高音雙頭','中音','次中音','上低音','其他'];
const COLORS=['#0b7a5a','#2b7fb8','#e0a526','#e8743b','#8e6bbf','#8a9a94'];

// 滿幾個月（從 a 起算，每個月同日同時刻才算滿 1 個月）
function fullMonths(a,b){
  let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
  if(m<=0)return 0;
  if(new Date(a.getFullYear(),a.getMonth()+m,a.getDate(),a.getHours(),a.getMinutes())>b)m--;
  return Math.max(0,m);
}
const commAt=(t)=>{let base=0,tot=0;
  sales.forEach(s=>{const d=new Date(s.time);if(d<=t){const c=s.price*RATE;base+=c;tot+=c*Math.pow(1+MR,fullMonths(d,t))}});
  return {base,tot}};

function render(){
  const sorted=[...sales].sort((a,b)=>b.time.localeCompare(a.time));
  const sum=sales.reduce((s,x)=>s+x.price,0),c=commAt(new Date());
  $('tSum').textContent=fmt(sum);$('tCount').textContent=sales.length+' 件';$('tComm').textContent=fmt(c.tot);
  $('cTotal').textContent=fmt(c.tot);$('cBase').textContent=fmt(c.base);$('cGain').textContent='+'+fmt(c.tot-c.base).slice(4);
  $('finishes').innerHTML=[...new Set(sales.map(x=>x.finish).filter(Boolean))].map(f=>`<option value="${esc(f)}">`).join('');
  $('list').innerHTML=sorted.length?sorted.map(x=>`<div class="item"><div>${esc(label(x))}<br><small>${x.buyer?esc(x.buyer)+'・':''}${x.time.replace('T',' ')}</small></div><div><span class="p">${fmt(x.price)}</span><button class="x" data-id="${x.id}" aria-label="刪除">×</button></div></div>`).join(''):'<div class="empty">還沒有紀錄</div>';
  drawPie();drawLine('lineSales',t=>{const v=sales.filter(s=>new Date(s.time)<=t).reduce((a,s)=>a+s.price,0);return v},null);
  drawLine('lineComm',t=>commAt(t).tot,t=>commAt(t).base);
  drawBars();drawTypeBars();renderBanner();
}

function drawTypeBars(){
  const rows=CATS.map((k,i)=>{const l=sales.filter(s=>catOf(s)===k);return {k,i,n:l.length,sum:l.reduce((a,s)=>a+s.price,0)}})
    .filter(r=>r.n||r.k!=='其他');
  if(!sales.length){$('typeBars').innerHTML='<div class="empty">還沒有資料</div>';return}
  const max=Math.max(1,...rows.map(r=>r.n));
  $('typeBars').innerHTML=rows.map(r=>`<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:14px"><span>${r.k}</span><span><b>${r.n}</b> 支・${fmt(r.sum)}</span></div>
    <div style="height:10px;background:var(--line);border-radius:5px;margin-top:4px"><div style="height:100%;width:${r.n/max*100}%;background:${COLORS[r.i]};border-radius:5px"></div></div></div>`).join('');
}

function drawPie(){
  const cnt=CATS.map(k=>sales.filter(s=>catOf(s)===k).length),total=cnt.reduce((a,b)=>a+b,0);
  if(!total){$('pie').innerHTML='<div class="empty">還沒有資料</div>';$('legend').innerHTML='';return}
  const R=70,r=42,cx=90,cy=90;let a0=-Math.PI/2,g='';
  cnt.forEach((n,i)=>{if(!n)return;
    const a1=a0+n/total*2*Math.PI;
    if(n===total){g+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${COLORS[i]}" stroke-width="${R-r}"/>`}
    else{const p=(a,rr)=>`${cx+rr*Math.cos(a)} ${cy+rr*Math.sin(a)}`,big=a1-a0>Math.PI?1:0;
      g+=`<path d="M${p(a0,R)} A${R} ${R} 0 ${big} 1 ${p(a1,R)} L${p(a1,r)} A${r} ${r} 0 ${big} 0 ${p(a0,r)}Z" fill="${COLORS[i]}"/>`}
    a0=a1});
  $('pie').innerHTML=`<svg viewBox="0 0 180 180" width="190" style="display:block;margin:auto" role="img" aria-label="售出類型圓餅圖">${g}<text x="90" y="88" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--ink)">${total}</text><text x="90" y="104" text-anchor="middle">件</text></svg>`;
  $('legend').innerHTML=CATS.map((k,i)=>cnt[i]?`<div><i style="background:${COLORS[i]}"></i>${k} ${cnt[i]} 件・${Math.round(cnt[i]/total*100)}%</div>`:'').join('');
}

// 折線圖：fn 為主線（實線），fn2 為輔助虛線
function drawLine(id,fn,fn2){
  if(!sales.length){$(id).innerHTML='<div class="empty">還沒有資料</div>';return}
  const t0=Math.min(...sales.map(s=>+new Date(s.time))),now=Date.now(),t1=Math.max(now,t0+864e5);
  const N=60,pts=[];
  for(let i=0;i<=N;i++){const t=new Date(t0+(t1-t0)*i/N);pts.push({t,v:fn(t),v2:fn2?fn2(t):0})}
  const W=340,H=190,L=44,B=24,T=14,max=Math.max(1,...pts.map(p=>p.v)),
    X=i=>L+(W-L-8)*i/N,Y=v=>H-B-(H-B-T)*v/max;
  const path=k=>pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p[k]).toFixed(1)}`).join('');
  const d=t=>`${t.getFullYear()}/${t.getMonth()+1}/${t.getDate()}`;
  const k=v=>v>=10000?Math.round(v/1000)/10+'萬':Math.round(v);
  $(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">
    <line x1="${L}" x2="${W-8}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
    <line x1="${L}" x2="${W-8}" y1="${Y(max/2)}" y2="${Y(max/2)}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${L-4}" y="${Y(max)+3}" text-anchor="end">${k(max)}</text>
    <text x="${L-4}" y="${Y(max/2)+3}" text-anchor="end">${k(max/2)}</text>
    <text x="${L-4}" y="${H-B+3}" text-anchor="end">0</text>
    ${fn2?`<path d="${path('v2')}" fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
    <path d="${path('v')} L${X(N)} ${H-B} L${X(0)} ${H-B}Z" fill="var(--main)" opacity=".1"/>
    <path d="${path('v')}" fill="none" stroke="var(--main)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(N)}" cy="${Y(pts[N].v)}" r="3.5" fill="var(--main)"/>
    <text x="${L}" y="${H-6}">${d(pts[0].t)}</text><text x="${W-8}" y="${H-6}" text-anchor="end">${d(pts[N].t)}</text>
    <text x="${X(N)}" y="${Y(pts[N].v)-8}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmt(pts[N].v)}</text>
  </svg>`;
}

function drawBars(){
  const len=mode==='day'?10:6,buckets=[],now=new Date();
  for(let i=len-1;i>=0;i--){
    const d=new Date(now);
    if(mode==='day')d.setDate(d.getDate()-i);else{d.setDate(1);d.setMonth(d.getMonth()-i)}
    const k=mode==='day'?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    buckets.push({k,label:mode==='day'?`${d.getMonth()+1}/${d.getDate()}`:`${d.getMonth()+1}月`,sum:0,count:0});
  }
  sales.forEach(s=>{const b=buckets.find(b=>s.time.startsWith(b.k));if(b){b.sum+=s.price;b.count++}});
  const max=Math.max(1,...buckets.map(b=>b[kind])),W=340,H=180,bw=W/len;let g='';
  buckets.forEach((b,i)=>{
    const h=b[kind]/max*(H-50),x=i*bw+bw*.15,w=bw*.7,y=H-26-h;
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="var(--main2)"/>`;
    if(b[kind])g+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle">${kind==='sum'?Math.round(b.sum/1000*10)/10+'k':b.count}</text>`;
    g+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${b.label}</text>`;
  });
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="銷售長條圖">${g}<line x1="0" x2="${W}" y1="${H-26}" y2="${H-26}" stroke="var(--line)"/></svg>`;
}

$('add').onclick=()=>{
  const type=$('type').value,price=parseFloat($('price').value),time=$('time').value||nowLocal();
  if(isNaN(price)||price<0){alert('請填成交價');return}
  sales.push({id:Date.now(),type,head:type==='高音'?$('head').value:'',finish:$('finish').value.trim(),buyer:$('buyer').value.trim(),code:$('code').value.trim().toUpperCase(),price,time});
  save();markDirty();justAdded=true;snoozed=false;
  ['finish','price','buyer','code'].forEach(k=>$(k).value='');$('time').value=nowLocal();render();show('home');
};
$('type').onchange=()=>$('headWrap').hidden=$('type').value!=='高音';
$('time').value=nowLocal();
$('list').onclick=e=>{
  const id=e.target.dataset.id;
  if(id&&confirm('刪除這筆紀錄？')){sales=sales.filter(x=>x.id!=id);save();markDirty();render()}
};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));drawBars()});
$('kind').onclick=()=>{kind=kind==='sum'?'count':'sum';$('kind').textContent=kind==='sum'?'看金額':'看件數';drawBars()};

function show(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));
  scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));

$('csv').onclick=()=>{
  const rows=csvText().split('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+rows.join('\n')],{type:'text/csv'}));
  a.download=`sax-sales-${nowLocal().slice(0,10)}.csv`;a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const rows=parseRows(await f.text());
  sales.push(...rows);
  save();markDirty();render();alert(`匯入 ${rows.length} 筆`);e.target.value='';
};

// ===== 備份 / 還原 / 提醒 / 永久保存 =====
const MK='saxMail',LK='saxLast',DK='saxDirty';
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let dirty=+ls(DK)||0,justAdded=false,snoozed=false;
const markDirty=()=>{dirty++;ss(DK,dirty)};
try{const m=new URLSearchParams(location.search).get('mail');if(m)ss(MK,m)}catch(e){}
$('mail').value=ls(MK)||'';
$('mail').onchange=()=>ss(MK,$('mail').value.trim());
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

function csvText(){
  const q=s=>`"${String(s||'').replace(/"/g,'""')}"`;
  return ['類型,頭型,編號,塗裝,成交價,買家,售出時間',...sales.map(x=>[q(x.type||x.name),q(x.head),q(x.code||x.note),q(x.finish),x.price,q(x.buyer),x.time].join(','))].join('\n');
}
function parseRows(text){
  const out=[];
  text.replace(/^\ufeff/,'').split(/\r?\n/).forEach((l,i)=>{
    l=l.replace(/^[>\s]+/,'').trim();
    const c=[...l.matchAll(/"((?:[^"]|"")*)"|([^,]+)/g)].map(m=>m[1]!==undefined?m[1].replace(/""/g,'"'):m[2]);
    if(c.length<7||isNaN(+c[4])||!/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(c[6]))return;
    out.push({id:Date.now()+i,type:c[0],head:c[1],code:c[2],finish:c[3],price:+c[4],buyer:c[5],time:c[6]});
  });
  return out;
}
function backup(){
  const to=$('mail').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(to)){show('home');alert('請先在下方填好「備份信箱」');return}
  ss(MK,to);
  const subj=encodeURIComponent('LC 薩克斯風帳本備份 '+nowLocal().replace('T',' '));
  const body='LC 薩克斯風帳本備份（還原時請整段複製，不要修改）\n'+csvText();
  let url=`mailto:${to}?subject=${subj}&body=${encodeURIComponent(body)}`;
  if(url.length>6000){
    try{navigator.clipboard.writeText(body)}catch(e){}
    alert('紀錄比較多，備份內容已經複製好了。信件打開後，請在內文長按貼上，再按傳送。');
    url=`mailto:${to}?subject=${subj}&body=${encodeURIComponent('（請在這裡貼上）')}`;
  }
  ss(LK,Date.now());dirty=0;ss(DK,0);justAdded=false;render();
  location.href=url;
}
function renderBanner(){
  const last=+ls(LK)||0,days=last?(Date.now()-last)/864e5:99;
  let msg='';
  if(dirty>0&&justAdded)msg='✅ 已記錄。順手寄一份備份到信箱，資料就不怕不見。';
  else if(dirty>0&&(dirty>=5||days>=7))msg=`⏰ ${last?'已經 '+Math.floor(days)+' 天沒備份':'還沒備份過'}，有 ${dirty} 筆變動還沒備份。`;
  $('banner').hidden=!msg||snoozed;$('bannerMsg').textContent=msg;
}
$('bk').onclick=$('bk2').onclick=backup;
$('snooze').onclick=()=>{snoozed=true;renderBanner()};
$('rsBtn').onclick=()=>{
  const rows=parseRows($('rs').value);
  if(!rows.length){alert('找不到備份內容，請確認有把信裡的內文整段貼上');return}
  if(!confirm(`這份備份有 ${rows.length} 筆紀錄，會取代目前 app 裡的紀錄，確定要還原嗎？`))return;
  sales=rows;save();dirty=0;ss(DK,0);$('rs').value='';render();alert('還原完成');
};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
